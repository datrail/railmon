[package]
name = "railmon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime-interaction collector for DatRail — pairs agent HTTP traffic from AgentSight and forwards it with an agent_id."

[dependencies]
# The pairing pipeline itself. AgentSight already reconstructs HTTP from raw SSL
# events and handles SSE, gzip, chunked and truncation; this crate is that
# pipeline published as a library. A caret requirement rather than an exact pin,
# so a `cargo update` picks up upstream fixes; Cargo.lock records the version a
# build uses. The probe binary the image ships is pinned separately, by release
# tag and checksum, in the Dockerfile (DR-204).
agentsight-capture = "1.0"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
uuid = "1"
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Decoding a compressed HTTP/1 reply before AgentSight's parser turns its bytes
# into text (src/http1_decode.rs). The same crates and versions AgentSight's
# HTTPDecompressor already builds, so nothing new is compiled.
flate2 = "1"
brotli-decompressor = "4"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
# Encodes Brotli test bodies; already built for AgentSight's HTTPDecompressor.
brotli = "7"

[[bin]]
name = "railmon"
path = "src/main.rs"
