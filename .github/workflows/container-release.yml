# Publishes ghcr.io/<owner>/<repo>:X.Y.Z (and :X.Y and :latest for stable
# releases) on a version tag push: `git tag v0.1.0 && git push --tags`.
# Each architecture builds natively on its own runner, one job joins them under
# the version tags and attests the result, and a last job creates the tag's
# GitHub Release (a pre-release whenever the tag is kept off :latest), whose
# notes open with the annotated tag's message.
name: container-release

on:
  push:
    # A coarse shape filter; the version job is the actual validator.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# One release at a time, so two tags cannot race on :X.Y and :latest. A third
# tag pushed while one runs and one waits cancels the waiting one: push one at a time.
concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          SCAN_SIDECAR_IMAGE: ${{ vars.SCAN_SIDECAR_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH release tag; refusing to publish."
            exit 1
          fi
          if [[ -z "$SCAN_SIDECAR_IMAGE" ]]; then
            echo "::warning::SCAN_SIDECAR_IMAGE isn't set: the scan-sidecar image won't be pushed to Artifact Registry (see the scan-sidecar-build job)."
          fi
          # A prerelease must not move :latest.
          if [[ "$TAG" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  # A tag can sit on a commit that never went through a PR.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      matrix:
        include:
          # amd64 shares CI's cache scope, so it reuses the layers CI just built.
          - arch: amd64
            runner: ubuntu-26.04
            cache: image
          - arch: arm64
            runner: ubuntu-26.04-arm
            cache: image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags only feed the version label here; the default rules would give it the leading `v`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      # Pushed untagged, by digest; the publish job tags the joined index.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          # The signed attestation in the publish job replaces buildx's unsigned one.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > digest

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      # Values reach the shell through env, never through `${{ }}` inside run:.
      - id: index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag_args=()
          while read -r tag; do tag_args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for digest in digest-*/digest; do sources+=("$IMAGE@$(cat "$digest")"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify with `gh attestation verify oci://ghcr.io/<owner>/<repo>@<digest> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # The storage record needs `artifact-metadata: write`; verification reads the attestation.
          create-storage-record: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # RC-518: the scan-sidecar image (Dockerfile.scan-sidecar), to Artifact
  # Registry, where GKE pulls it with no pull secret. Both architectures,
  # natively, as the main image is, joined under the same version tags.
  #
  # Pushes as a Google service account through Workload Identity Federation,
  # with no key: the repository's variables name it.
  #   SCAN_SIDECAR_IMAGE          us-docker.pkg.dev/<project>/<repository>/scan-sidecar
  #   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
  #   GCP_ARTIFACT_PUSHER         the service account, with roles/artifactregistry.writer on the repository
  #
  # Until SCAN_SIDECAR_IMAGE is set, both jobs are skipped and the version job
  # warns, so a fork or a repository without Artifact Registry still releases
  # the main image.
  scan-sidecar-build:
    needs: ci
    if: ${{ vars.SCAN_SIDECAR_IMAGE != '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_PUSHER }}
          token_format: access_token

      - id: registry
        env:
          IMAGE: ${{ vars.SCAN_SIDECAR_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[^/]+/[^/]+/[^/:@]+$ ]]; then
            echo "::error::SCAN_SIDECAR_IMAGE '$IMAGE' isn't an Artifact Registry image (REGION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE)."
            exit 1
          fi
          echo "host=${IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.SCAN_SIDECAR_IMAGE }}
          tags: type=semver,pattern={{version}}

      # The same build CI tested (its cache scope), pushed untagged by digest.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scan-sidecar
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ vars.SCAN_SIDECAR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          # The signed attestation in scan-sidecar-publish replaces buildx's unsigned one.
          provenance: false
          cache-from: type=gha,scope=scan-sidecar-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=scan-sidecar-${{ matrix.arch }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > digest

      - uses: actions/upload-artifact@v7
        with:
          name: scan-sidecar-digest-${{ matrix.arch }}
          path: digest
          retention-days: 1

  scan-sidecar-publish:
    needs: [version, scan-sidecar-build]
    if: ${{ vars.SCAN_SIDECAR_IMAGE != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: scan-sidecar-digest-*

      - uses: docker/setup-buildx-action@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_PUSHER }}
          token_format: access_token

      - id: registry
        env:
          IMAGE: ${{ vars.SCAN_SIDECAR_IMAGE }}
        run: echo "host=${IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.SCAN_SIDECAR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      - id: index
        env:
          IMAGE: ${{ vars.SCAN_SIDECAR_IMAGE }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag_args=()
          while read -r tag; do tag_args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for digest in scan-sidecar-digest-*/digest; do sources+=("$IMAGE@$(cat "$digest")"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The build turns buildx's unsigned provenance off (provenance: false), as the
      # main image's does, so this signed attestation is the image's provenance. It
      # is pushed beside the image in Artifact Registry with the login above.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.SCAN_SIDECAR_IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # The storage record needs `artifact-metadata: write`; verification reads the attestation.
          create-storage-record: false

      - name: Summary
        env:
          IMAGE: ${{ vars.SCAN_SIDECAR_IMAGE }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "### Scan-sidecar image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\` (pin it in the chart's image.digest)"
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --repo $GH_REPO\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Release is the page people read. Its own job: only it holds `contents: write`, and a
  # failure once `publish` has succeeded re-runs just this.
  release:
    needs: [version, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ needs.publish.outputs.tags }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          PRERELEASE: ${{ needs.version.outputs.latest != 'true' }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publish gave no index digest ('$DIGEST'); refusing to write a Release."
            exit 1
          fi
          # The annotated tag's message says what the version changes; it opens the
          # notes, before the image, since it is the paragraph a reader wants first.
          # A lightweight tag has no message and the notes start at the image. A
          # signature block, should a tag be signed, is not part of the message.
          summary=""
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          if [[ "$ref" == "tag "* ]]; then
            summary=$(gh api "repos/$GH_REPO/git/tags/${ref#tag }" --jq .message \
              | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')
          fi
          {
            if [[ -n "${summary//[[:space:]]/}" ]]; then
              printf '%s\n' "$summary"
              echo
            fi
            echo "## Container image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```sh'
            echo "docker pull $IMAGE@$DIGEST"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $GH_REPO"
            echo '```'
            echo
            gh api -X POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md
          # Pre-release exactly when the tag is kept off :latest; `--verify-tag` never invents a tag.
          flags=(--title "$TAG" --notes-file notes.md "--prerelease=$PRERELEASE" --verify-tag)
          if author=$(gh release view "$TAG" --json author --jq .author.login 2> /dev/null); then
            if [[ "$author" == "github-actions[bot]" ]]; then
              # Rewrites a Release made with GITHUB_TOKEN; `--draft=false` since a tag deleted and pushed again leaves a draft.
              url=$(gh release edit "$TAG" --draft=false "${flags[@]}")
            else
              # Made by anyone else, a person or another app: left as it is.
              echo "::notice::Release $TAG was created by $author and is left as it is."
              url=$(gh release view "$TAG" --json url --jq .url)
            fi
          else
            url=$(gh release create "$TAG" "${flags[@]}")
          fi
          {
            echo "### Release"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
