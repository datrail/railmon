# Publishes ghcr.io/<owner>/<repo>:X.Y.Z (and :X.Y and :latest for stable
# releases) on a version tag push: `git tag v0.1.0 && git push --tags`.
# Each architecture builds natively on its own runner, then one job joins them
# under the version tags and attests the result.
name: container-release

on:
  push:
    # A coarse shape filter; the version job is the actual validator.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# One release at a time, so two tags cannot race on :X.Y and :latest. A third
# tag pushed while one runs and one waits cancels the waiting one: push one at a time.
concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH release tag; refusing to publish."
            exit 1
          fi
          # A prerelease must not move :latest.
          if [[ "$TAG" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  # A tag can sit on a commit that never went through a PR.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      matrix:
        include:
          # amd64 shares CI's cache scope, so it reuses the layers CI just built.
          - arch: amd64
            runner: ubuntu-26.04
            cache: image
          - arch: arm64
            runner: ubuntu-26.04-arm
            cache: image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # The image compiles the probes from the ebpf-tls-tap submodule (public).
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags only feed the version label here; the default rules would give it the leading `v`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      # Pushed untagged, by digest; the publish job tags the joined index.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          # The signed attestation in the publish job replaces buildx's unsigned one.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > digest

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      # Values reach the shell through env, never through `${{ }}` inside run:.
      - id: index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag_args=()
          while read -r tag; do tag_args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for digest in digest-*/digest; do sources+=("$IMAGE@$(cat "$digest")"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify with `gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <org>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # The storage record needs `artifact-metadata: write`; verification reads the attestation.
          create-storage-record: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
