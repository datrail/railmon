# Publishes ghcr.io/<owner>/<repo>:X.Y.Z (and :X.Y and :latest for stable
# releases) on a version tag push: `git tag v0.1.0 && git push --tags`.
# Each architecture builds natively on its own runner, one job joins them under
# the version tags and attests the result, and a last job creates the tag's
# GitHub Release (a pre-release whenever the tag is kept off :latest).
name: container-release

on:
  push:
    # A coarse shape filter; the version job is the actual validator.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# One release at a time, so two tags cannot race on :X.Y and :latest. A third
# tag pushed while one runs and one waits cancels the waiting one: push one at a time.
concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH release tag; refusing to publish."
            exit 1
          fi
          # A prerelease must not move :latest.
          if [[ "$TAG" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  # A tag can sit on a commit that never went through a PR.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      matrix:
        include:
          # amd64 shares CI's cache scope, so it reuses the layers CI just built.
          - arch: amd64
            runner: ubuntu-26.04
            cache: image
          - arch: arm64
            runner: ubuntu-26.04-arm
            cache: image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags only feed the version label here; the default rules would give it the leading `v`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      # Pushed untagged, by digest; the publish job tags the joined index.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          # The signed attestation in the publish job replaces buildx's unsigned one.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > digest

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      # Values reach the shell through env, never through `${{ }}` inside run:.
      - id: index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag_args=()
          while read -r tag; do tag_args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for digest in digest-*/digest; do sources+=("$IMAGE@$(cat "$digest")"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify with `gh attestation verify oci://ghcr.io/<owner>/<repo>@<digest> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # The storage record needs `artifact-metadata: write`; verification reads the attestation.
          create-storage-record: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Release is the page people read. Its own job: only it holds `contents: write`, and a
  # failure once `publish` has succeeded re-runs just this.
  release:
    needs: [version, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ needs.publish.outputs.tags }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          PRERELEASE: ${{ needs.version.outputs.latest != 'true' }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publish gave no index digest ('$DIGEST'); refusing to write a Release."
            exit 1
          fi
          {
            echo "## Container image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```sh'
            echo "docker pull $IMAGE@$DIGEST"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $GH_REPO"
            echo '```'
            echo
            gh api -X POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md
          # Pre-release exactly when the tag is kept off :latest; `--verify-tag` never invents a tag.
          flags=(--title "$TAG" --notes-file notes.md "--prerelease=$PRERELEASE" --verify-tag)
          if author=$(gh release view "$TAG" --json author --jq .author.login 2> /dev/null); then
            if [[ "$author" == "github-actions[bot]" ]]; then
              # Rewrites this workflow's own Release; `--draft=false` since a tag deleted and pushed again leaves a draft.
              url=$(gh release edit "$TAG" --draft=false "${flags[@]}")
            else
              # Made by anyone else, a person or another app: left as it is.
              echo "::notice::Release $TAG was created by $author and is left as it is."
              url=$(gh release view "$TAG" --json url --jq .url)
            fi
          else
            url=$(gh release create "$TAG" "${flags[@]}")
          fi
          {
            echo "### Release"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
