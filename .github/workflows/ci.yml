# Test and build on every change, so a break surfaces on the pull request
# rather than after a release tag exists.
#
# This is also called by container-release.yml, which gates publishing on it.
# A tag can sit on any commit — including one that never went through a PR —
# so the release path re-runs these checks rather than trusting that they ran
# earlier.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. A called workflow's `github.ref` is the
          caller's, which on workflow_dispatch is the branch the run was
          launched from rather than the tag being published — so the release
          path passes the resolved tag explicitly. Empty means "whatever
          triggered this run", which is right for pull_request and push.
        type: string
        required: false
        default: ""

# Declared here so this workflow is correct when triggered directly. A caller
# may also set permissions on the calling job — those flow in, and this file
# can only narrow them, never widen.
permissions:
  contents: read

# Superseding a pull-request push is what you want; losing a commit's only CI
# signal is not. So the group key differs by event: a PR groups by ref, so a new
# push supersedes the last; everything else groups by SHA, so each commit gets
# its own group and cannot be evicted.
#
# That second half matters because `cancel-in-progress: false` does not protect
# a *pending* run — a newer run entering the group cancels a queued one either
# way. Keyed by ref, three quick pushes to master would leave the middle commit
# untested, which is the one case where a green master means nothing.
#
# `github.event_name` in a called workflow is the caller's, so the release path
# reads `push` or `workflow_dispatch` here — never `pull_request`. Either way it
# keys by SHA and runs to completion. Note the SHA differs between the two: a
# tag push gives the tagged commit, a dispatch gives the HEAD of the branch the
# run was launched from, which is why the tag itself travels through the `ref`
# input rather than being inferred from the context here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 to
    # 11-19, run by run (actions/runner-images#14748). Move on purpose (DR-133).
    runs-on: ubuntu-26.04
    steps:
      # Submodules follow the same rule as the release workflow: off unless the
      # repository declares RAIL_SUBMODULES, and the cross-repo PAT is only
      # handed to a checkout that is actually fetching from another repo.
      #
      # This depends on the caller passing `secrets: inherit`. `vars` reach a
      # called workflow on their own, but secrets do not — without inherit,
      # SUBMODULE_TOKEN resolves to an empty string while RAIL_SUBMODULES still
      # reads truthy, and the recursive checkout would go out with a token that
      # cannot read another repository.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ vars.RAIL_SUBMODULES || false }}
          token: ${{ vars.RAIL_SUBMODULES && secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `make test` has a Python half since DR-84 folded RailScan's scanner and
      # forwarder in. Pinned rather than relying on whatever the runner ships,
      # so a runner image bump cannot quietly change what the scanner is tested
      # against.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      # Cache the registry and the build tree. agentsight-capture pulls hyper,
      # tokio and rusqlite, so a cold build is minutes and a warm one is not.
      - uses: Swatinem/rust-cache@v2

      # `make test` runs fmt, clippy with warnings denied, the Rust tests, and
      # the Python scanner's tests.
      - run: make test

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ vars.RAIL_SUBMODULES || false }}
          token: ${{ vars.RAIL_SUBMODULES && secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Build only — nothing is pushed from a pull request. Single-arch amd64:
      # this is here to catch a Dockerfile that does not build, or an image
      # that builds but fails the scan and acceptance steps below, and the arm64
      # leg costs QEMU emulation for a signal the amd64 leg already gives.
      #
      # amd64 is also the arch that can fail *specifically*: the Dockerfile
      # installs the AgentSight release binary on amd64 and skips it elsewhere,
      # so the arm64 leg does not exercise that path at all.
      #
      # The cache scope is shared with container-release.yml on purpose, so the
      # multi-arch publish reuses these amd64 layers instead of rebuilding them.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded into the runner's daemon so the next step can run the very
          # image a release would publish, not a separate source build.
          load: true
          tags: railmon:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # The scanner loads its evidence-bundle schemas at import, from the
      # image's own copy rather than the checkout, so only a scan run in the
      # image shows whether the Dockerfile ships everything it reads.
      - name: Scan inside the built image
        run: docker run --rm railmon:ci scan --mode self --host-id ci --compact > /dev/null

      # The RailScan-era command names and script paths are deprecated but
      # kept: the old paths are symlinks, which only a run in the image shows
      # survived COPY.
      - name: Legacy names inside the built image
        run: |
          docker run --rm railmon:ci agent-environment-scanner --mode self --host-id ci --compact > /dev/null
          docker run --rm railmon:ci skills-scanner --help > /dev/null
          docker run --rm railmon:ci rail-collector --help > /dev/null
          for script in tools/agent-environment-scanner/scan_agent_environment.py \
                        tools/skills-scanner/skill_scanner.py \
                        rail-collector/rail_collector.py; do
            docker run --rm --entrypoint python3 railmon:ci "/opt/railmon/$script" --help > /dev/null
          done

      # The built-binary acceptance scripts (DR-109 M3/M4, DR-129) need root so
      # the supervisor and each agent run under distinct UIDs. The container's
      # root gives them that, and their AgentSight is a stub each script writes,
      # so no eBPF, privilege or host PID namespace is involved. RAILMON_BIN
      # points them at the collector the image ships; fail_closed also runs
      # the scanner the image ships, since /tests has no source tree beside it.
      - name: Acceptance against the built image
        run: |
          for t in two_agent target_restart ticket_claim analyzer_panic fail_closed ambiguous_capture webhook_auth; do
            echo "::group::${t}_acceptance"
            docker run --rm --user 0 --entrypoint python3 \
              -e RAILMON_BIN=/usr/local/bin/railmon-collector \
              -v "$PWD/tests:/tests:ro" \
              railmon:ci "/tests/${t}_acceptance.py"
            echo "::endgroup::"
          done
          # The same two-agent run stopped the way `docker stop` stops it
          # (DR-130): SIGTERM must flush and exit 0 like SIGINT.
          docker run --rm --user 0 --entrypoint python3 \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/two_agent_acceptance.py --stop-signal TERM

      # Unlike the step above, this one needs privilege: stale PID reuse forces
      # the newcomer onto the old PID through /proc/sys/kernel/ns_last_pid,
      # which takes CHECKPOINT_RESTORE, a writable /proc/sys, and no
      # docker-default AppArmor profile (it denies writes under
      # /proc/sys/kernel). Granted to this one run only.
      - name: Stale PID reuse acceptance against the built image
        run: |
          docker run --rm --user 0 --entrypoint python3 \
            --cap-add CHECKPOINT_RESTORE \
            --security-opt systempaths=unconfined --security-opt apparmor=unconfined \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/pid_reuse_acceptance.py

      # DR-143: the probe the image ships, deployed the way the README says.
      # An agent container opens a port. `railmon listen`, a privileged
      # supervisor in the host PID namespace, runs listensnoop inside the
      # agent's and appends to a volume the agent does not mount, and
      # `railmon scan` reads it into the bundle. Then the agent kills the
      # probe (the bundle must go PARTIAL) and restarts (the probe must
      # follow). The privilege is the listen container's alone.
      - name: listen and scan from the built image
        run: python3 tests/listen_image_acceptance.py --image railmon:ci

      # DR-154: the same deployment for filesnoop. An agent container writes
      # a file; `railmon files` runs filesnoop inside its PID namespace, and
      # `railmon scan` folds the write into observed_file_access. Then the
      # probe is killed and the bundle must go PARTIAL.
      - name: files and scan from the built image
        run: python3 tests/files_image_acceptance.py --image railmon:ci

      # DR-109 M4: this image and RailDash's, run together the way a user runs
      # them (raildash/docs/asp-v1-acceptance.md). RailDash is built from its
      # own master, so a break on either side of the seam shows up here. Not
      # on the release path (inputs.ref set): a tag's result must not depend
      # on whatever RailDash master is that day, so it runs on PRs and pushes.
      - name: Check out RailDash
        if: inputs.ref == ''
        uses: actions/checkout@v7
        with:
          repository: datrail/raildash
          path: raildash
          persist-credentials: false

      - name: RailMon and RailDash images together
        if: inputs.ref == ''
        run: |
          docker build -t raildash:ci raildash
          docker network create railmon-raildash
          docker run -d --name raildash --network railmon-raildash \
            -p 127.0.0.1:8000:8000 raildash:ci
          for _ in $(seq 60); do
            token=$(docker exec raildash cat /data/raildash.db.token 2>/dev/null || true)
            [ -n "$token" ] && curl -fsS http://127.0.0.1:8000/webhook/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          [ -n "$token" ] || { docker logs raildash; exit 1; }
          # Keyed runtime rows over the collector's webhook: RailDash must
          # store both agents' rows with their keys, attribution and PIDs.
          docker run --rm --network railmon-raildash --user 0 --entrypoint python3 \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/two_agent_acceptance.py --raildash http://raildash:8000 \
            || { docker logs raildash; exit 1; }
          # Interval scans delivering evidence bundles with the token RailDash
          # wrote (DR-83), without a restart. Nothing about the scanned
          # container changes between scans, so every delivery after the
          # first is the same bytes and RailDash keeps exactly one ASP
          # (DR-157) rather than one per interval.
          docker run -d --name railmon-scan --network railmon-raildash \
            -e RAIL_RAILDASH_TOKEN="$token" -e RAIL_HOST_ID=ci-host \
            railmon:ci scan --mode self --agent-key ci-agent \
            --raildash-url http://raildash:8000 --interval 2
          count() {
            curl -fsS http://127.0.0.1:8000/api/asps | python3 -c \
              'import json, sys; print(sum(i["agent_identity"]["value"] == "ci-agent" for i in json.load(sys.stdin)["items"]))'
          }
          duplicates=0
          for _ in $(seq 60); do
            duplicates=$(docker logs railmon-scan 2>&1 | grep -c 'delivered evidence bundle to raildash: HTTP 202 duplicate' || true)
            [ "$duplicates" -ge 2 ] && break
            sleep 0.5
          done
          asps=$(count || echo 0)
          [ "$duplicates" -ge 2 ] && [ "$asps" -eq 1 ] \
            || { docker logs railmon-scan; docker logs raildash; exit 1; }
          echo "{\"result\": \"PASS\", \"interval_deliveries\": $((duplicates + 1)), \"interval_asps\": $asps}"
          # DR-125: a listening socket that appears after the baseline was
          # locked is drift, and an unchanged window is not. Real scanner in
          # the image, real RailDash, listensnoop lines in a mounted file.
          mkdir -p "$RUNNER_TEMP/listen"
          python3 tests/listen_drift_acceptance.py \
            --raildash http://127.0.0.1:8000 --scan-raildash http://raildash:8000 \
            --token "$token" \
            --listen-dir "$RUNNER_TEMP/listen" --scan-listen-dir /listen \
            --scan "docker run --rm --network railmon-raildash -e RAIL_RAILDASH_TOKEN -e RAIL_HOST_ID -v $RUNNER_TEMP/listen:/listen:ro railmon:ci scan" \
            || { docker logs raildash; exit 1; }
          # DR-154: a newly written path, and a write to a file that was
          # only read, is drift on observed_file_access alone; another
          # process reading a known file is not. DR-166: a second run of
          # randomly named temp files stays aligned, and a new fixed name in
          # /tmp is drift. filesnoop lines in a mounted file.
          mkdir -p "$RUNNER_TEMP/files"
          python3 tests/files_drift_acceptance.py \
            --raildash http://127.0.0.1:8000 --scan-raildash http://raildash:8000 \
            --token "$token" \
            --files-dir "$RUNNER_TEMP/files" --scan-files-dir /files \
            --scan "docker run --rm --network railmon-raildash -e RAIL_RAILDASH_TOKEN -e RAIL_HOST_ID -v $RUNNER_TEMP/files:/files:ro railmon:ci scan" \
            || { docker logs raildash; exit 1; }
          # DR-109: a manifest-scoped scan delivers one evidence-bundle v2
          # collection; locked as the baseline, a declared agent whose
          # process stops is drift on that agent alone.
          docker run --rm --network railmon-raildash --user 0 --entrypoint python3 \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/multi_agent_drift_acceptance.py \
            --raildash http://raildash:8000 --token "$token" \
            || { docker logs raildash; exit 1; }
