# Test and build on every change, so a break surfaces on the pull request
# rather than after a release tag exists.
#
# This is also called by container-release.yml, which gates publishing on it.
# A tag can sit on any commit — including one that never went through a PR —
# so the release path re-runs these checks rather than trusting that they ran
# earlier.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. A called workflow's `github.ref` is the
          caller's, which on workflow_dispatch is the branch the run was
          launched from rather than the tag being published — so the release
          path passes the resolved tag explicitly. Empty means "whatever
          triggered this run", which is right for pull_request and push.
        type: string
        required: false
        default: ""

# Declared here so this workflow is correct when triggered directly. A caller
# may also set permissions on the calling job — those flow in, and this file
# can only narrow them, never widen.
permissions:
  contents: read

# Superseding a pull-request push is what you want; losing a commit's only CI
# signal is not. So the group key differs by event: a PR groups by ref, so a new
# push supersedes the last; everything else groups by SHA, so each commit gets
# its own group and cannot be evicted.
#
# That second half matters because `cancel-in-progress: false` does not protect
# a *pending* run — a newer run entering the group cancels a queued one either
# way. Keyed by ref, three quick pushes to master would leave the middle commit
# untested, which is the one case where a green master means nothing.
#
# `github.event_name` in a called workflow is the caller's, so the release path
# reads `push` or `workflow_dispatch` here — never `pull_request`. Either way it
# keys by SHA and runs to completion. Note the SHA differs between the two: a
# tag push gives the tagged commit, a dispatch gives the HEAD of the branch the
# run was launched from, which is why the tag itself travels through the `ref`
# input rather than being inferred from the context here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Submodules follow the same rule as the release workflow: off unless the
      # repository declares RAIL_SUBMODULES, and the cross-repo PAT is only
      # handed to a checkout that is actually fetching from another repo.
      #
      # This depends on the caller passing `secrets: inherit`. `vars` reach a
      # called workflow on their own, but secrets do not — without inherit,
      # SUBMODULE_TOKEN resolves to an empty string while RAIL_SUBMODULES still
      # reads truthy, and the recursive checkout would go out with a token that
      # cannot read another repository.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ vars.RAIL_SUBMODULES || false }}
          token: ${{ vars.RAIL_SUBMODULES && secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `make test` has a Python half since DR-84 folded RailScan's scanner and
      # forwarder in. Pinned rather than relying on whatever the runner ships,
      # so a runner image bump cannot quietly change what the scanner is tested
      # against.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # Cache the registry and the build tree. agentsight-capture pulls hyper,
      # tokio and rusqlite, so a cold build is minutes and a warm one is not.
      - uses: Swatinem/rust-cache@v2

      # `make test` runs fmt, clippy with warnings denied, the Rust tests, and
      # the Python scanner's tests.
      - run: make test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ vars.RAIL_SUBMODULES || false }}
          token: ${{ vars.RAIL_SUBMODULES && secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed from a pull request. Single-arch amd64:
      # this is here to catch a Dockerfile that does not build, or an image
      # that builds but fails the scan and acceptance steps below, and the arm64
      # leg costs QEMU emulation for a signal the amd64 leg already gives.
      #
      # amd64 is also the arch that can fail *specifically*: the Dockerfile
      # installs the AgentSight release binary on amd64 and skips it elsewhere,
      # so the arm64 leg does not exercise that path at all.
      #
      # The cache scope is shared with container-release.yml on purpose, so the
      # multi-arch publish reuses these amd64 layers instead of rebuilding them.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded into the runner's daemon so the next step can run the very
          # image a release would publish, not a separate source build.
          load: true
          tags: railmon:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # The scanner loads its evidence-bundle schemas at import, from the
      # image's own copy rather than the checkout, so only a scan run in the
      # image shows whether the Dockerfile ships everything it reads.
      - name: Scan inside the built image
        run: docker run --rm railmon:ci scan --mode self --host-id ci --compact > /dev/null

      # The built-binary acceptance scripts (DR-109 M3/M4, DR-129) need root so
      # the supervisor and each agent run under distinct UIDs. The container's
      # root gives them that, and their AgentSight is a stub each script writes,
      # so no eBPF, privilege or host PID namespace is involved. RAILMON_BIN
      # points them at the collector the image ships; fail_closed also runs
      # the scanner the image ships, since /tests has no source tree beside it.
      - name: Acceptance against the built image
        run: |
          for t in two_agent target_restart ticket_claim analyzer_panic fail_closed; do
            echo "::group::${t}_acceptance"
            docker run --rm --user 0 --entrypoint python3 \
              -e RAILMON_BIN=/usr/local/bin/railmon-collector \
              -v "$PWD/tests:/tests:ro" \
              railmon:ci "/tests/${t}_acceptance.py"
            echo "::endgroup::"
          done
          # The same two-agent run stopped the way `docker stop` stops it
          # (DR-130): SIGTERM must flush and exit 0 like SIGINT.
          docker run --rm --user 0 --entrypoint python3 \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/two_agent_acceptance.py --stop-signal TERM
          # Stale PID reuse forces the newcomer onto the old PID through
          # /proc/sys/kernel/ns_last_pid, which needs CHECKPOINT_RESTORE and a
          # writable /proc/sys — scoped to this run only.
          echo "::group::pid_reuse_acceptance"
          docker run --rm --user 0 --entrypoint python3 \
            --cap-add CHECKPOINT_RESTORE --security-opt systempaths=unconfined \
            -e RAILMON_BIN=/usr/local/bin/railmon-collector \
            -v "$PWD/tests:/tests:ro" \
            railmon:ci /tests/pid_reuse_acceptance.py
          echo "::endgroup::"
