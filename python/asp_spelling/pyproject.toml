# One spelling for each ASP value, and one normalization from an evidence bundle to
# each agent's attributes, shared by RailDash and Rail Center.
# Standard library only. Rail Center installs it pinned to a railmon commit:
#   asp-spelling @ git+https://github.com/datrail/railmon@<commit>#subdirectory=python/asp_spelling
# RailDash vendors asp_spelling.py byte-for-byte, as it does RailMon's schemas.
[build-system]
# 77 is the first that reads an SPDX `license` string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asp-spelling"
description = "One spelling for each Agent Security Profile value, and one normalization of an evidence bundle into each agent's attributes"
version = "1"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
py-modules = ["asp_spelling", "asp_normalize"]
